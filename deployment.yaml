apiVersion: apps/v1
kind: Deployment
metadata:
  name: html-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: html-app
  template:
    metadata:
      labels:
        app: html-app
    spec:
      containers:
        - name: html-container
          image: madhukesh2005/selenium-testng-automation:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080